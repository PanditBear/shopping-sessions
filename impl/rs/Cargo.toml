[package]
name = "shop"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1"
memmap2 = "0.9"
memchr = "2"
ahash = "0.8"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "55", default-features = false, features = ["zstd", "lz4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
