name: bench (linux, scorer docker flags)
on:
  workflow_dispatch:
    inputs:
      refs:
        default: "none"
      runs:
        default: "5"
      probe:
        default: "0"
      perf:
        default: "0"
      events:
        default: "60000000"
      clicks:
        default: "15000000"
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools bc
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y -q --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-azure \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic || true
          sudo apt-get install -y -q --no-install-recommends linux-perf || true
          command -v perf || ls /usr/lib/linux-tools/*/perf || true
      - name: perf
        env:
          EV: ${{ github.event.inputs.events || '60000000' }}
          CK: ${{ github.event.inputs.clicks || '15000000' }}
        run: |
          set +e; set -uo pipefail
          W=/tmp/pf; mkdir -p $W; R=$W/rep; mkdir -p $R
          { echo "== machine"; lscpu | grep -E 'Model name|^CPU\(s\)|Thread|L1d|L2|L3|Hypervisor'; free -g | head -2; uname -r; } 2>&1 | tee $R/machine.txt
          P=$(command -v perf || ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1 || true); echo "perf=$P" | tee -a $R/machine.txt
          $P --version 2>&1 | tee -a $R/machine.txt
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 2>&1 | tee -a $R/machine.txt
          grep -q "6975P" $R/machine.txt || { echo "SKIP: no counters on this CPU" | tee -a $R/machine.txt; exit 0; }
          curl -sSfL -o $W/gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo "13724cadbac5a99d847e27cea911cd2e338ff972b46c2039da87452011bb101e  $W/gen.zip" | sha256sum -c --quiet
          (cd $W && unzip -q -o gen.zip && cd generator && cargo build --release -q)
          G=$(find $W -path '*release/generate' -type f | head -1)
          echo "sha: $(git rev-parse HEAD)" | tee -a $R/machine.txt
          (cd impl/rs && CC_x86_64_unknown_linux_musl=musl-gcc RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes" \
             CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none CARGO_TARGET_DIR=$W/tgtp \
             cargo build --release --locked -q --target x86_64-unknown-linux-musl) && cp $W/tgtp/x86_64-unknown-linux-musl/release/shop $W/shop-prof
          ls -l $W/shop-prof
          D=$W/data; $G --seed 7 --events $EV --clicks $CK --output $D --threads 4 >/dev/null
          o=$(mktemp -d); s2=$(mktemp -d)
          E="DATA_DIR=$D OUTPUT_DIR=$o SCRATCH_DIR=$s2 NCPU=4 SHOP_TIMING=1"
          echo "== warm-up"; sudo env $E $W/shop-prof 2>&1 | grep -E 'written|prof'
          echo "== perf stat"
          sudo env $E $P stat -e task-clock,cycles,instructions,branches,branch-misses,cache-references,cache-misses,page-faults -o $R/stat.txt $W/shop-prof 2> $R/stat.ticks.txt
          cat $R/stat.txt $R/stat.ticks.txt | tee -a $R/stat.all.txt | tail -40
          echo "== perf list (counters)"; $P list 2>&1 | grep -E 'mem_load_retired|dtlb_(load|store)_misses.walk|cycle_activity|topdown|slots' | head -80 | tee $R/perflist.txt
          st() { nm=$1; shift; echo "### stat $nm: $*" | tee -a $R/topdown.txt; sudo env $E $P stat "$@" -o $R/st.$nm.txt $W/shop-prof >/dev/null 2>$R/st.$nm.err; cat $R/st.$nm.txt | grep -vE '^#|^$' | tee -a $R/topdown.txt; head -3 $R/st.$nm.err | tee -a $R/topdown.txt; }
          st td1 --topdown
          st tdL1 -M TopdownL1
          st tdL2 -M TopdownL2
          st tdraw -e slots,topdown-retiring,topdown-bad-spec,topdown-fe-bound,topdown-be-bound
          st tdraw2 -e slots,topdown-retiring,topdown-bad-spec,topdown-fe-bound,topdown-be-bound,topdown-heavy-ops,topdown-br-mispredict,topdown-fetch-lat,topdown-mem-bound
          st core -e cycles,instructions,branches,branch-misses
          st ml -e mem_load_retired.l1_miss,mem_load_retired.l2_miss,mem_load_retired.l3_miss,mem_load_retired.fb_hit
          st ml2 -e mem_load_retired.l1_hit,mem_load_retired.l2_hit,mem_load_retired.l3_hit,instructions
          st tlb -e dtlb_load_misses.walk_completed,dtlb_store_misses.walk_completed,dtlb_load_misses.stlb_hit,dtlb_store_misses.stlb_hit
          st stall -e cycle_activity.stalls_l1d_miss,cycle_activity.stalls_l2_miss,cycle_activity.stalls_l3_miss,cycle_activity.stalls_total
          st stall2 -e cycle_activity.cycles_l1d_miss,cycle_activity.cycles_mem_any,resource_stalls.sb,cycles
          $P list > $W/pl.txt 2>&1; grep -E 'resource_stalls|exe_activity|l1d_pend_miss|dtlb_store|mem_inst_retired' $W/pl.txt | head -60 | tee $R/perflist.store.txt
          sx() { nm=$1; shift; L=""; for e in "$@"; do if grep -qw -- "$e" $W/pl.txt; then L="$L,$e"; else echo "skip $e (not in perf list)" | tee -a $R/topdown.txt; fi; done; L=${L#,}; [ -n "$L" ] && st $nm -e $L,cycles; }
          sx sx1 resource_stalls.sb exe_activity.bound_on_stores mem_inst_retired.all_stores
          sx sx2 l1d_pend_miss.fb_full l1d_pend_miss.fb_full_periods
          sx sx3 dtlb_store_misses.walk_completed dtlb_store_misses.walk_active
          cp $R/topdown.txt $R/topdown.keep
          rec() { nm=$1; EVT=$2; c=$(grep -E "$EVT" $R/st.$3.txt | grep -vE 'not supported|not counted' | awk '{gsub(",","",$1); print $1}' | head -1)
            case "$c" in ''|*[!0-9]*) echo "rec $nm: no count for $EVT" | tee -a $R/machine.txt; return;; esac
            PER=$(( c / 40000 + 1 )); echo "rec $nm $EVT count=$c period=$PER" | tee -a $R/machine.txt
            sudo env $E $P record -q -c $PER -e ${EVT}:pp -g -o $W/r$nm.data $W/shop-prof >/dev/null 2>$R/rec.$nm.ticks.txt
            if [ ! -s $W/r$nm.data ]; then echo "no pp for $nm" | tee -a $R/machine.txt; sudo env $E $P record -q -c $PER -e ${EVT} -g -o $W/r$nm.data $W/shop-prof >/dev/null 2>$R/rec.$nm.ticks.txt; fi
            sudo chmod a+r $W/r$nm.data
            sudo $P script -i $W/r$nm.data -G -F time,ip,sym 2>/dev/null > $W/r$nm.txt
            head -1 $W/r$nm.txt | tee $R/t0.$nm.txt; wc -l < $W/r$nm.txt | tee -a $R/machine.txt
            grep -E 'parse_events_sol' $W/r$nm.txt | awk '{print $1, $2}' | gzip -6 > $R/pe.$nm.gz
            grep -E '^\[[0-9.]+s\]' $R/rec.$nm.ticks.txt > $R/ticks.$nm.txt
            grep -E 'parse_events_sol' $W/r$nm.txt | awk '{print $2}' | sort -u > $W/ips.$nm.txt
            addr2line -i -f -a -e $W/shop-prof < $W/ips.$nm.txt 2>/dev/null | gzip -6 > $R/a2l.$nm.gz
            sudo $P report -i $W/r$nm.data --stdio -n --no-children -g none --sort symbol 2>/dev/null | grep -v '^#' | grep -v '^$' | cut -c1-150 | head -25 > $R/top.$nm.txt
          }
          rec cyc cycles core
          rec ins instructions core
          rec l1m mem_load_retired.l1_miss ml
          rec tlbs dtlb_store_misses.walk_completed tlb
          rec l3m mem_load_retired.l3_miss ml
          rec sbs resource_stalls.sb sx1
          rec sts mem_inst_retired.all_stores sx1
          rec fbf l1d_pend_miss.fb_full sx2
          echo "== done"; ls -l $R; head -20 $R/top.*.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-pmu
          path: /tmp/pf/rep
