name: bench (linux, scorer docker flags)
on:
  push:
    branches: [bench]
  workflow_dispatch:
    inputs:
      refs:
        description: "commits or branches to compare, space separated"
        required: true
      runs:
        description: "timed runs per ref"
        default: "5"
      probe:
        description: "1 = one SHOP_PROBE run per image"
        default: "1"
      perf:
        description: "1 = perf profile of the first image's binary on the host"
        default: "1"
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: bench
      - name: toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools bc
          rustup target add x86_64-unknown-linux-musl
      - name: bench
        env:
          RUNS: ${{ github.event.inputs.runs || '5' }}
          REFS: ${{ github.event.inputs.refs || '1698b09 1698b09@MIMALLOC_ALLOW_LARGE_OS_PAGES=1 1698b09@MIMALLOC_PURGE_DELAY=-1 1698b09@MIMALLOC_ALLOW_LARGE_OS_PAGES=1@MIMALLOC_PURGE_DELAY=-1' }}
          PROBE: ${{ github.event.inputs.probe || '1' }}
          PERF: ${{ github.event.inputs.perf || '1' }}
        run: bash bench.sh $REFS
