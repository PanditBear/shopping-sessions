name: bench (linux, scorer docker flags)
on:
  push:
    branches: [bench]
  workflow_dispatch:
    inputs:
      refs:
        description: "commits or branches to compare, space separated"
        default: "none"
      perfsha:
        description: "if set: run only the hotspot profile (perf) of this commit"
        default: ""
      perfsizes:
        description: "profile sizes, events:clicks pairs"
        default: "60000000:15000000 20000000:5000000"
      runs:
        description: "timed runs per ref"
        default: "5"
      probe:
        description: "1 = one SHOP_PROBE run per image"
        default: "1"
      perf:
        description: "1 = perf profile of the first image's binary on the host"
        default: "1"
      exitprobe:
        description: "1 = split exit time: teardown vs docker, native run, kernel profile"
        default: "0"
      events:
        description: "events in the generated dataset"
        default: "20000000"
      clicks:
        description: "clicks in the generated dataset"
        default: "5000000"
permissions:
  contents: read
jobs:
  bench:
    if: ${{ github.event.inputs.perfsha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: bench
      - name: toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools bc
          rustup target add x86_64-unknown-linux-musl
      - name: bench
        env:
          RUNS: ${{ github.event.inputs.runs || '5' }}
          REFS: ${{ github.event.inputs.refs || '8d8e4cc e513d9d 8d8e4cc@MIMALLOC_ALLOW_LARGE_OS_PAGES=1@MIMALLOC_VERBOSE=1 1698b09' }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
          PERF: ${{ github.event.inputs.perf || '0' }}
          EXITPROBE: ${{ github.event.inputs.exitprobe || '0' }}
          EVENTS: ${{ github.event.inputs.events || '20000000' }}
          CLICKS: ${{ github.event.inputs.clicks || '5000000' }}
        run: bash bench.sh $REFS
  perf:
    if: ${{ github.event.inputs.perfsha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: bench
      - name: toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends musl-tools bc
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y -q --no-install-recommends linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-azure || true
          ls /usr/lib/linux-tools/*/perf || true
      - name: perf
        env:
          SHA: ${{ github.event.inputs.perfsha }}
          SIZES: ${{ github.event.inputs.perfsizes }}
          CPUS: 4
        run: |
          set -uo pipefail
          W=/tmp/pf; mkdir -p $W
          echo "== machine"; lscpu | grep -E 'Model name|^CPU\(s\)|Thread|L1d|L2|L3|Hypervisor' | cut -c1-200; free -g | head -2; uname -r
          P=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); echo "perf=$P"; [ -n "$P" ] && $P --version
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          curl -sSfL -o $W/gen.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo "13724cadbac5a99d847e27cea911cd2e338ff972b46c2039da87452011bb101e  $W/gen.zip" | sha256sum -c --quiet
          (cd $W && unzip -q -o gen.zip && cd generator && cargo build --release -q)
          G=$(find $W -path '*release/generate' -type f | head -1)
          git worktree add -q --detach $W/src "$SHA"; echo "sha: $(git -C $W/src rev-parse HEAD)"
          # shipped build (same flags as the image build)
          (cd $W/src/impl/rs && CC_x86_64_unknown_linux_musl=musl-gcc RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_TARGET_DIR=$W/tgt \
             cargo build --release --locked -q --target x86_64-unknown-linux-musl) && cp $W/tgt/x86_64-unknown-linux-musl/release/shop $W/shop-ship
          # profiling build: same flags plus line tables and frame pointers
          (cd $W/src/impl/rs && CC_x86_64_unknown_linux_musl=musl-gcc RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes" \
             CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none CARGO_TARGET_DIR=$W/tgtp \
             cargo build --release --locked -q --target x86_64-unknown-linux-musl) && cp $W/tgtp/x86_64-unknown-linux-musl/release/shop $W/shop-prof
          ls -l $W/shop-ship $W/shop-prof
          n=0
          for sz in $SIZES; do
            n=$((n+1)); ev=${sz%%:*}; ck=${sz##*:}
            echo; echo "################ events=$ev clicks=$ck"
            D=$W/data$n; $G --seed 7 --events $ev --clicks $ck --output $D --threads 4 >/dev/null
            o=$(mktemp -d); s2=$(mktemp -d)
            E="DATA_DIR=$D OUTPUT_DIR=$o SCRATCH_DIR=$s2 NCPU=$CPUS SHOP_TIMING=1"
            echo "== plain run (shipped)"; sudo env $E $W/shop-ship 2>&1 | grep -E 'written|prof'
            echo "== stat: hardware events (shipped binary)"
            sudo env $E $P stat -e task-clock,cycles,instructions,branches,branch-misses,cache-references,cache-misses $W/shop-ship 2>&1 | grep -v '^\[' | tail -18
            echo "== stat: LLC and dTLB"
            sudo env $E $P stat -e LLC-loads,LLC-load-misses,dTLB-loads,dTLB-load-misses,L1-dcache-load-misses,page-faults $W/shop-ship 2>&1 | grep -v '^\[' | tail -14
            echo "== stat: raw mem_load_retired (if supported)"
            sudo env $E $P stat -e mem_load_retired.l3_miss,mem_load_retired.l2_miss,mem_load_retired.l1_miss $W/shop-ship 2>&1 | grep -v '^\[' | tail -8
            echo "== record (try cycles, fall back to cpu-clock)"
            EV=cycles; R=$W/perf$n.data
            sudo env $E $P record -q -F 4999 -e cycles -g -o $R $W/shop-prof >/dev/null 2>$W/rec.err || true
            if [ ! -s $R ] || grep -qi 'not supported\|cannot\|error' $W/rec.err; then
              head -5 $W/rec.err; EV=cpu-clock
              sudo env $E $P record -q -F 4999 -e cpu-clock -g -o $R $W/shop-prof >/dev/null 2>&1
            fi
            echo "event used: $EV"
            echo "== top symbols (self)"
            sudo $P report -i $R --stdio --no-children -g none --sort sym --percent-limit 0.4 2>/dev/null | grep -v '^#' | grep -v '^$' | head -45
            echo "== by thread name"
            sudo $P report -i $R --stdio --no-children -g none --sort comm 2>/dev/null | grep -v '^#' | grep -v '^$' | head -12
            echo "== call chains of the hottest symbols"
            sudo $P report -i $R --stdio --no-children -G --sort sym --percent-limit 4 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120
            echo "== inclusive view"
            sudo $P report -i $R --stdio --children -g none --sort sym --percent-limit 3 2>/dev/null | grep -v '^#' | grep -v '^$' | head -30
            echo "== annotate top 3"
            for s in $(sudo $P report -i $R --stdio --no-children -g none --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -3 | awk '{print $NF}'); do
              echo "---- annotate $s"
              sudo $P annotate -i $R --stdio -s "$s" > $W/ann.txt 2>/dev/null
              awk '$1+0>=0.8' $W/ann.txt | sort -rn | head -25
              echo "-- context of the hottest 3"
              for pc in $(awk '$1+0>=0.8 {print $1" "$2}' $W/ann.txt | sort -rn | head -3 | awk '{print $2}'); do grep -B5 -A1 -F -- "$pc" $W/ann.txt | head -14; echo ..; done
            done
            sudo find $o $s2 -mindepth 1 -delete; sudo rm -f $R; sudo find $D -mindepth 1 -delete
          done
