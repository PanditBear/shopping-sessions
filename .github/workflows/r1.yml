name: r1 ready check
on:
  push:
    branches: [ready-r1]
permissions:
  contents: read
jobs:
  job:
    strategy:
      fail-fast: false
      matrix:
        role: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: run
        run: bash r1/job.sh ${{ matrix.role }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binsha-${{ matrix.role }}
          path: /tmp/r1/binsha-${{ matrix.role }}.txt
  compare:
    needs: job
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: |
          cat art/*/*.txt
          a=$(cut -d' ' -f2 art/binsha-A/binsha-A.txt); b=$(cut -d' ' -f2 art/binsha-B/binsha-B.txt)
          if [ "$a" = "$b" ]; then echo "BINARIES IDENTICAL A==B $a"; else echo "BINARIES DIFFER A=$a B=$b"; fi
